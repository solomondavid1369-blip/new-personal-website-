<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride &amp; Co | Pacer 3</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1E2124;--lime:#C6F432;--bone:#F2F1EC;--orange:#FF6B2C;--grey:#9AA0A6;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0F1113;font-family:'Inter',Arial,sans-serif;color:var(--bone)}
  .email{width:600px;margin:30px auto;background:var(--ink);overflow:hidden}
  .d{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.5px;font-weight:400}
  section{position:relative;width:600px}
  .btn{display:inline-block;padding:18px 40px;font-size:20px;font-weight:600;text-decoration:none;border-radius:4px}
  .btn-lime{background:var(--lime);color:var(--ink)}
  .btn-ink{background:var(--ink);color:var(--lime)}

  /* 1. Hero */
  .hero{height:750px;background:url('https://d8j0ntlcm91z4.cloudfront.net/user_3EH1EVlj1q4IZbpc1ehVHrTO8Ra/hf_20261107_121140_186509e0-1d68-4bc8-892f-85991a50ba2f.png') center bottom/cover}
  .hero::after{content:"";position:absolute;inset:auto 0 0 0;height:160px;background:linear-gradient(180deg,rgba(30,33,36,0),var(--ink))}
  .logo{position:absolute;top:30px;left:40px;font-size:24px;color:var(--lime);z-index:2}
  .drop{position:absolute;top:34px;right:40px;font-size:16px;color:var(--grey);z-index:2}
  .hero h1{position:absolute;top:96px;left:40px;font-size:118px;line-height:.9;z-index:2}
  .hero h1 span{color:var(--lime)}
  .hero .cta{position:absolute;left:40px;bottom:46px;z-index:2;display:flex;align-items:center;gap:22px}
  .hero .cta p{font-size:20px}

  /* 2. Route */
  .route{height:720px;background:var(--ink)}
  .route svg{position:absolute;inset:0}
  .route h2{position:absolute;top:56px;left:40px;font-size:56px;line-height:1}
  .shoe{position:absolute;top:240px;left:150px;width:300px;height:300px;border-radius:50%;background:url('https://d8j0ntlcm91z4.cloudfront.net/user_3EH1EVlj1q4IZbpc1ehVHrTO8Ra/hf_20261107_121138_9849210c-9df7-4f06-b8ad-9e84c3f71504.png') center/cover;box-shadow:0 0 0 10px rgba(198,244,50,.12),0 30px 80px rgba(0,0,0,.6)}
  .mk{position:absolute;font-size:20px;line-height:1.3}
  .mk b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:30px;color:var(--lime)}
  .route .cta{position:absolute;left:0;right:0;bottom:46px;text-align:center}

  /* 3. Midsole */
  .mid{height:700px;background:url('https://d8j0ntlcm91z4.cloudfront.net/user_3EH1EVlj1q4IZbpc1ehVHrTO8Ra/hf_20261107_041949_c7b8ae9a-4837-479a-84f9-83171dd864b7.png') center 30%/cover}
  .mid::before{content:"";position:absolute;inset:0 0 auto 0;height:140px;background:linear-gradient(180deg,var(--ink),rgba(30,33,36,0))}
  .mid::after{content:"";position:absolute;inset:auto 0 0 0;height:300px;background:linear-gradient(180deg,rgba(30,33,36,0),var(--ink) 60%)}
  .mid h2{position:absolute;top:44px;left:40px;font-size:56px;line-height:1;z-index:2}
  .stats{position:absolute;left:40px;right:40px;bottom:50px;display:flex;justify-content:space-between;z-index:2}
  .stat b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:72px;line-height:1;color:var(--lime)}
  .stat span{font-size:20px;color:var(--grey)}

  /* 4. Finish */
  .finish{height:750px;background:url('https://d8j0ntlcm91z4.cloudfront.net/user_3EH1EVlj1q4IZbpc1ehVHrTO8Ra/hf_20261107_041747_4dc9a66a-1aa8-4d1e-ae90-f722461835b7.png') center/cover}
  .finish::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;background:linear-gradient(180deg,var(--ink),rgba(30,33,36,0))}
  .finish::after{content:"";position:absolute;inset:auto 0 0 0;height:300px;background:linear-gradient(180deg,rgba(255,107,44,0),var(--orange) 70%)}
  .finish h2{position:absolute;top:60px;left:0;right:0;text-align:center;font-size:84px;line-height:.92;z-index:2}
  .finish .cta{position:absolute;left:0;right:0;bottom:50px;text-align:center;z-index:2;color:var(--ink)}
  .finish .price{font-family:'Anton',Impact,sans-serif;font-size:44px;margin-bottom:16px}
</style>
</head>
<body>
<div class="email">

  <section class="hero">
    <div class="logo d">Stride &amp; Co</div>
    <div class="drop">Pacer 3</div>
    <h1 class="d">Rain day?<br><span>Run day.</span></h1>
    <div class="cta">
      <a class="btn btn-lime" href="#">Shop Pacer 3</a>
      <p>Out now</p>
    </div>
  </section>

  <section class="route">
    <h2 class="d">Your 21K,<br>mapped.</h2>
    <svg width="600" height="720" viewBox="0 0 600 720" aria-hidden="true">
      <path d="M70 250 C 20 360, 140 420, 90 520 S 300 690, 420 600 S 600 420, 520 300 S 470 170, 560 130" fill="none" stroke="#C6F432" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
      <circle cx="70" cy="250" r="10" fill="#C6F432"/>
      <circle cx="90" cy="520" r="10" fill="#C6F432"/>
      <circle cx="520" cy="300" r="10" fill="#C6F432"/>
    </svg>
    <div class="shoe"></div>
    <div class="mk" style="top:276px;left:40px;width:110px;">
      <b>KM 0</b>Grips wet roads</div>
    <div class="mk" style="top:546px;left:40px;width:150px;">
      <b>KM 10</b>Still bouncy</div>
    <div class="mk" style="top:326px;right:40px;width:110px;text-align:right;">
      <b>KM 21</b>Yes, still bouncy</div>
    <div class="cta"><a class="btn btn-lime" href="#">Find your size</a></div>
  </section>

  <section class="mid">
    <h2 class="d">The bounce<br>is the point.</h2>
    <div class="stats">
      <div class="stat"><b>38mm</b><span>foam stack</span></div>
      <div class="stat"><b>212g</b><span>per shoe</span></div>
      <div class="stat"><b>8mm</b><span>drop</span></div>
    </div>
  </section>

  <section class="finish">
    <h2 class="d">Finish line's<br>that way.</h2>
    <div class="cta">
      <div class="price">£140</div>
      <a class="btn btn-ink" href="#">Shop Pacer 3</a>
    </div>
  </section>

</div>
</body>
</html>
